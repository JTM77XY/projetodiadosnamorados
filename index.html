<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>pagina</title>
</head>
<body>
    <header>
        <nav>
            <div class="logo">dia dos namorados</div>
             <ul>
                <li><a href="#home">home</a></li>
                <li><a href="#galeria">galeria</a></li>
                <li><a href="#contato">contato</a></li>
            </ul>  
        </nav>
    </header>

    <main>
        <section id="galeria">
            <h2>nossa galeria</h2>
            <div class="galeria">
                <div class="galeria-item">
                    <img src="https://picsum.photos/200/200?radom=1" alt="natureza 1" class="img-clicavel">
                </div>
                <div class="galeria-item">
                    <img src="https://picsum.photos/200/200?radom=2" alt="natureza 1" class="img-clicavel">
                </div>
                <div class="galeria-item">
                    <img src="https://picsum.photos/200/200?radom=3" alt="natureza 1" class="img-clicavel">
                </div>
                <div class="galeria-item">
                    <img src="https://picsum.photos/200/200?radom=4" alt="natureza 1" class="img-clicavel">
                </div>
                <div class="galeria-item">
                    <img src="https://picsum.photos/200/200?radom=5" alt="natureza 1" class="img-clicavel">
                </div>
                <div class="galeria-item">
                    <img src="https://picsum.photos/200/200?radom=6" alt="natureza 1" class="img-clicavel">
                </div>
            </div>
        </section>

        <section id="contato">
            <h2>fale conosco</h2>
            <div class="contato-container">
                <div class="contato-info">
                    <h3>Informações</h3>
                    <br>
                    <p><strong>Endereço:</strong> Av. Paulista, 1000 - São Paulo, SP</p>
                    <br>
                    <p><strong>E-mail:</strong> contato@exemplo.com</p>
                </div>

                <form class="contato-form" id="meuFormulario">
                    <div class="form-group">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" required placeholder="Digite seu nome">
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" required placeholder="seuemail@exemplo.com">
                    </div>
                    <div class="form-group">
                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem" rows="4" required placeholder="Como podemos ajudar?"></textarea>
                    </div>
                    <button type="submit">Enviar Mensagem</button>
                </form>
            </div>
        </section>
        
    </main>
    <footer><p>pagina namoro</p></footer>
    <script src="script.js"></script>
</body>
</html>
